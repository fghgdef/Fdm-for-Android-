<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مدير التنزيلات</title>
<style>
:root{
  --bg:#F3F1EC; --panel:#FFFFFF; --line:#DAD5CB; --text:#222621; --sub:#6B6A62;
  --accent:#1C7C74; --accent-ink:#0E4E49; --warn:#C98A2C; --err:#B23A2E; --ok:#2E7D32; --track:#E7E3D9;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",sans-serif;
  padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);}
.num{font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  padding:calc(14px + env(safe-area-inset-top,0)) 16px 12px;}
h1{font-size:17px;margin:0 0 12px;font-weight:650;}
h1 span{color:var(--accent);}
.addrow{display:flex;gap:8px;flex-wrap:wrap;}
.addrow input{flex:1 1 180px;min-width:0;background:var(--track);border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;}
.addrow button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:0 16px;
  font-size:14px;font-weight:600;cursor:pointer;}
.segrow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--sub);}
.segrow select{background:var(--track);border:1px solid var(--line);border-radius:6px;padding:4px 8px;color:var(--text);}
main{padding:14px 16px 30px;}
.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
.item-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;}
.item-name{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.badge{font-size:10.5px;padding:2px 8px;border-radius:20px;white-space:nowrap;}
.badge.downloading{background:rgba(28,124,116,.15);color:var(--accent-ink);}
.badge.paused{background:rgba(201,138,44,.18);color:var(--warn);}
.badge.completed{background:rgba(46,125,50,.16);color:var(--ok);}
.badge.error{background:rgba(178,58,46,.16);color:var(--err);}
.bar{height:6px;background:var(--track);border-radius:4px;margin:9px 0 7px;overflow:hidden;}
.bar-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s linear;}
.item-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.stats{font-size:11.5px;color:var(--sub);display:flex;gap:10px;flex-wrap:wrap;}
.actions button{background:none;border:1px solid var(--line);color:var(--text);border-radius:6px;
  width:28px;height:28px;cursor:pointer;font-size:12px;margin-inline-start:6px;}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:50px 20px;}
</style>
</head>
<body>
<header>
  <h1>مدير<span>التنزيلات</span></h1>
  <div class="addrow">
    <input id="urlInput" type="text" placeholder="الصق رابط الملف هنا">
    <button id="addBtn">إضافة</button>
  </div>
  <div class="segrow">
    عدد الأجزاء:
    <select id="segCount"><option>1</option><option>2</option><option selected>4</option><option>8</option><option>16</option></select>
  </div>
</header>
<main id="list"><div class="empty">لا توجد تنزيلات بعد</div></main>

<script>
// ملاحظة: Capacitor يحقن window.Capacitor تلقائيًا عند تشغيل الصفحة داخل التطبيق الأصلي، لا حاجة لأي استيراد يدوي
const DM = window.Capacitor.Plugins.DownloadManager;
const list = document.getElementById('list');
let tasks = {}; // id -> task state

function fmtSize(b){ if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(0)+' KB'; return (b/1048576).toFixed(2)+' MB'; }
function fmtSpeed(bps){ return fmtSize(bps)+'/s'; }

function render(){
  const arr = Object.values(tasks);
  if(arr.length===0){ list.innerHTML = '<div class="empty">لا توجد تنزيلات بعد</div>'; return; }
  list.innerHTML = arr.map(t=>{
    const pct = t.totalBytes ? Math.min(100, t.downloadedBytes/t.totalBytes*100) : 0;
    const label = {queued:'بالانتظار',downloading:'جارٍ التنزيل',paused:'متوقف مؤقتًا',completed:'اكتمل',error:'خطأ'}[t.status] || t.status;
    return `<div class="item" data-id="${t.id}">
      <div class="item-top">
        <div class="item-name" title="${t.fileName}">${t.fileName}</div>
        <span class="badge ${t.status}">${label}</span>
      </div>
      <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="item-bottom">
        <div class="stats">
          <span class="num">${pct.toFixed(1)}%</span>
          <span class="num">${fmtSize(t.downloadedBytes||0)} / ${fmtSize(t.totalBytes||0)}</span>
          ${t.status==='downloading' ? `<span class="num">${fmtSpeed(t.speedBps||0)}</span>` : ''}
        </div>
        <div class="actions">
          ${t.status==='downloading' ? `<button data-act="pause">⏸</button>` : ''}
          ${t.status==='paused' ? `<button data-act="resume">▶</button>` : ''}
          ${t.status!=='completed' ? `<button data-act="cancel">✕</button>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

list.addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  const id = e.target.closest('.item').dataset.id;
  if(btn.dataset.act==='pause') DM.pause({ id });
  if(btn.dataset.act==='resume') DM.resume({ id });
  if(btn.dataset.act==='cancel'){ DM.cancel({ id }); delete tasks[id]; render(); }
});

document.getElementById('addBtn').addEventListener('click', async ()=>{
  const inp = document.getElementById('urlInput');
  const url = inp.value.trim();
  if(!url) return;
  const segments = Number(document.getElementById('segCount').value);
  const res = await DM.addDownload({ url, segments });
  tasks[res.id] = res;
  render();
  inp.value = '';
});

// استقبال تحديثات التقدم من الكود الأصلي (Kotlin)
DM.addListener('downloadProgress', (t)=>{
  tasks[t.id] = t;
  render();
});

// عند فتح التطبيق، اطلب قائمة التنزيلات الحالية (تشمل ما كان يعمل قبل إغلاق التطبيق)
(async ()=>{
  const res = await DM.list();
  (res.items||[]).forEach(t=> tasks[t.id] = t);
  render();
})();
</script>
</body>
</html>
