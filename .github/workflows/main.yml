name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # لا نستخدم android-actions/setup-android هنا إطلاقًا: هذا الإجراء
      # يحاول تثبيت حزمة قديمة اسمها "tools" لم تعد موجودة في مستودعات
      # Google ويفشل دائمًا. عدّاد Ubuntu الجاهز من GitHub يأتي أصلًا ومعه
      # Android SDK كامل (منصّات، أدوات بناء) وتراخيصه مقبولة مسبقًا.
      - name: Accept any remaining Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install JS dependencies
        run: npm install

      - name: Generate native Android project (Capacitor)
        run: npx cap add android

      - name: Merge custom native download engine into the project
        run: python3 scripts/patch-android.py

      - name: Show patched MainActivity (debug)
        run: find android/app/src/main/java -name MainActivity.java -exec echo "---- {} ----" \; -exec cat {} \;

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Beta release with the APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: "إصدار تجريبي (Beta) #${{ github.run_number }}"
          body: |
            بناء تلقائي من فرع main — commit: ${{ github.sha }}
            هذا إصدار تجريبي (Beta) لأغراض الاختبار فقط.
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
